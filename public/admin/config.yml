backend:
  name: github
  repo: LDH1103/ai-study-blog
  branch: main
  base_url: https://ai-study-blog-cms-auth.ldh517525.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "docs: add note {{slug}}"
    update: "docs: update note {{slug}}"
    delete: "docs: delete note {{slug}}"
    uploadMedia: "docs: add blog image {{path}}"
    deleteMedia: "docs: delete blog image {{path}}"

publish_mode: simple
site_url: https://ldh1103.github.io/ai-study-blog
display_url: https://ldh1103.github.io/ai-study-blog
media_folder: src/assets/images/uploads
public_folder: ../../assets/images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: notes
    label: 글
    label_singular: 글
    description: "저장·수정·삭제하면 main 브랜치에 커밋되고 GitHub Pages가 자동 배포됩니다. 삭제한 글은 Git 이력에서 복구할 수 있습니다."
    folder: src/content/notes
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "notes/{{slug}}"
    editor:
      preview: true
    fields:
      - label: 제목
        name: title
        widget: string
      - label: 요약
        name: description
        widget: text
      - label: 발행일
        name: publishedAt
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: 태그
        name: tags
        widget: list
        required: false
        field:
          label: 태그
          name: tag
          widget: string
      - label: 슬라이드 경로
        name: slidesHtml
        widget: string
        required: false
        hint: "선택 사항입니다. 예: /slides/발표-파일.html"
      - label: 초안
        name: draft
        widget: boolean
        required: false
        default: false
        hint: "초안은 공개 목록과 상세 페이지에 표시되지 않습니다."
      - label: 본문
        name: body
        widget: markdown
